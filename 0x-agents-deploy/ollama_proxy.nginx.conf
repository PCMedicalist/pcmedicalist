server {
  listen 11434;
  # Force IPv4 resolution (host.docker.internal may return IPv6 first,
  # but host Ollama binds IPv4 127.0.0.1:11434 -> IPv6 connect fails).
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $ollama_upstream http://host.docker.internal:11434;
  location / {
    proxy_pass $ollama_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Ollama streaming + SSE support
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

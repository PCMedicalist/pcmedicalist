version: '3.8'
services:
  0xcodexbot:
    build: ./0xCODEXbot
    env_file:
      - ./0xCODEXbot/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_API_URL=http://ollama_0xcodex:11434/api
      - PERSONA_LLM_PROVIDER=ollama
      - PERSONA_LLM_MODEL=gemma3:4b
      - OLLAMA_MODEL_NAME=gemma3:4b
      - RESPONSE_ENGINE_LLM_PROVIDER=ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./0xCODEXbot/logs:/app/logs
      - ./0xCODEXbot/data:/app/data
      - ./shared:/app/shared
    depends_on:
      - redis
      - ollama_0xcodex
    restart: unless-stopped


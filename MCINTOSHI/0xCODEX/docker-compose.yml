      - PERSONA_LLM_PROVIDER=ollama
      - PERSONA_LLM_MODEL=gemma3:4b
      - OLLAMA_MODEL_NAME=gemma3:4b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./VOID_0xbot/logs:/app/logs
      - ./VOID_0xbot/data:/app/data
      - ./shared:/app/shared
    depends_on:
      - redis
      - ollama_0xcodex
    restart: unless-stopped

  # Ollama proxy: forwards container :11434 -> host.docker.internal:11434
  # (live host Ollama). IPv4 forced because host.docker.internal resolves
  # IPv6 first but host Ollama binds IPv4 only. nginx stub replaced 2026-07-14.
  ollama_0xcodex:
    image: nginx:alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: []
    volumes:
      - ./ollama_proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://host.docker.internal:11434/api/tags"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

networks:
  default:
    driver: bridge

volumes:
  redis_data:
